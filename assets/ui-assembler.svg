<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="Ankit Jha — UI components assembling into a live interface">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .code { font-size: 10px; fill: #56565f; font-weight: 500; letter-spacing: 0.4px; }
    .sign { font-size: 9px; fill: #4b4b54; letter-spacing: 0.6px; }
    .chips { font-size: 7.5px; fill: #c3b6f7; font-weight: 600; letter-spacing: 0.6px; }
    .btn  { font-size: 8.5px; fill: #ffffff; font-weight: 600; letter-spacing: 0.8px; }
  </style>

  <!-- ============ code signature line ============ -->
  <text class="mono code" x="16" y="16">&lt;uiAssembly /&gt; — components, assembling…</text>

  <!-- ============ window chassis ============ -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="8s" repeatCount="indefinite" />
    <rect x="14" y="24" width="732" height="158" rx="14" fill="#0e0e13" stroke="#26262e" stroke-width="1.2" />
  </g>

  <!-- ============ header: logo dot + nav + avatar ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-28,-14;0,0;0,0;0,0;-28,-14" keyTimes="0;0.12;0.88;0.96;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;0.96" dur="8s" repeatCount="indefinite" />
    <circle cx="46" cy="42" r="5" fill="#8b5cf6" />
    <rect x="84"  y="36" width="30" height="7" rx="3.5" fill="#232329" />
    <rect x="122" y="36" width="30" height="7" rx="3.5" fill="#232329" />
    <rect x="160" y="36" width="30" height="7" rx="3.5" fill="#232329" />
    <circle cx="680" cy="42" r="8" fill="#1c1c24" stroke="#2f2f3a" stroke-width="1" />
  </g>

  <!-- top separator -->
  <line x1="14" y1="58" x2="746" y2="58" stroke="#17171c" stroke-width="1" />

  <!-- ============ left menu (sidebar skeleton) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-46,0;0,0;0,0;0,0;-46,0" keyTimes="0;0.15;0.88;0.97;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.9;0.97" dur="8s" repeatCount="indefinite" />
    <rect x="40" y="76" width="26" height="6" rx="3" fill="#1f1f26" />
    <rect x="40" y="92" width="26" height="6" rx="3" fill="#1f1f26" />
    <rect x="40" y="108" width="26" height="6" rx="3" fill="#1f1f26" />
    <rect x="40" y="124" width="26" height="6" rx="3" fill="#1f1f26" />
  </g>

  <!-- ============ hero copy skeleton ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,20;0,0;0,0;0,0;0,20" keyTimes="0;0.16;0.88;0.96;1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.14;0.9;0.96" dur="8s" repeatCount="indefinite" />
    <rect x="92" y="78"  width="176" height="9" rx="4.5" fill="#8b5cf6" />
    <rect x="92" y="96"  width="122" height="8" rx="4"  fill="#292932" />
    <rect x="92" y="112" width="96"  height="6" rx="3"  fill="#1f1f26" />
  </g>

  <!-- ============ accent button (pops into place) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,30;0,0;0,0;0,0;0,30" keyTimes="0;0.08;0.9;0.98;1" dur="8s" begin="0.22s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;0.98" dur="8s" begin="0.22s" repeatCount="indefinite" />
    <g transform="translate(144,141)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.74;1.06;1;1;0.74" keyTimes="0;0.1;0.22;0.92;1" dur="8s" begin="0.22s" repeatCount="indefinite" />
        <rect x="-52" y="-12" width="104" height="24" rx="12" fill="#8b5cf6" />
        <text class="mono btn" x="0" y="4.5" text-anchor="middle">RUN APP</text>
      </g>
    </g>
  </g>

  <!-- ============ feature card A (slides up) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,24;0,0;0,0;0,0;0,24" keyTimes="0;0.1;0.9;0.98;1" dur="8s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.93;0.99" dur="8s" begin="0.3s" repeatCount="indefinite" />
    <rect x="300" y="70" width="404" height="62" rx="8" fill="#101016" stroke="#26262e" stroke-width="1" />
    <rect x="312" y="84" width="56" height="6" rx="3" fill="#8b5cf6" />
    <rect x="312" y="98" width="120" height="6" rx="3" fill="#232329" />
    <rect x="312" y="110" width="88" height="6" rx="3" fill="#232329" />
    <rect x="640" y="84" width="30" height="6" rx="3" fill="#8b5cf6" />
    <rect x="640" y="98" width="40" height="6" rx="3" fill="#1e1e26" />
    <rect x="640" y="110" width="26" height="6" rx="3" fill="#22d3ee" />
  </g>

  <!-- ============ feature card B (slides up, staggered) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,24;0,0;0,0;0,0;0,24" keyTimes="0;0.1;0.9;0.98;1" dur="8s" begin="0.42s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.93;0.99" dur="8s" begin="0.42s" repeatCount="indefinite" />
    <rect x="300" y="140" width="404" height="34" rx="8" fill="#101016" stroke="#26262e" stroke-width="1" />
    <circle cx="318" cy="157" r="4" fill="#22d3ee" />
    <rect x="332" y="153" width="180" height="6" rx="3" fill="#232329" />
    <rect x="332" y="165" width="120" height="6" rx="3" fill="#1f1f26" />
  </g>

  <!-- ============ progress fill (assembly completes) ============ -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="8s" begin="0.7s" repeatCount="indefinite" />
    <path d="M56 184 H700" stroke="#1d1d24" stroke-width="2" stroke-linecap="round" />
    <path d="M56 184 H700" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-dasharray="644">
      <animate attributeName="stroke-dashoffset" from="644" to="0" dur="1.4s" begin="0.7s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" to="0" dur="8s" begin="0.7s" repeatCount="indefinite" values="644;0;0;644" keyTimes="0;0.16;0.85;1" />
    </path>
  </g>

  <!-- ============ ambient: live badge pulse ============ -->
  <circle cx="722" cy="42" r="3" fill="#22d3ee" />
  <circle cx="722" cy="42" r="3" fill="none" stroke="#22d3ee" stroke-width="1">
    <animate attributeName="r" values="3;9" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- ============ component chips fly in around the window ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-150,26;0,0;0,0;-150,26" keyTimes="0;0.1;0.28;0.4" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.08;0.24;0.32" dur="8s" repeatCount="indefinite" />
    <rect x="18" y="4" width="48" height="20" rx="6" fill="#15151b" stroke="#8b5cf6" stroke-width="1" />
    <text class="mono chips" x="42" y="17" text-anchor="middle">Btn</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="170,-44;0,0;0,0;170,-44" keyTimes="0;0.12;0.3;0.42" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.1;0.26;0.34" dur="8s" repeatCount="indefinite" />
    <rect x="688" y="4" width="52" height="20" rx="6" fill="#15151b" stroke="#8b5cf6" stroke-width="1" />
    <text class="mono chips" x="714" y="17" text-anchor="middle">Card</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="34,-160;0,0;0,0;34,-160" keyTimes="0;0.14;0.32;0.44" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.12;0.28;0.36" dur="8s" repeatCount="indefinite" />
    <rect x="54" y="182" width="54" height="20" rx="6" fill="#15151b" stroke="#8b5cf6" stroke-width="1" />
    <text class="mono chips" x="81" y="195" text-anchor="middle">Nav</text>
  </g>

  <!-- ============ signature ============ -->
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1.1s" fill="freeze" />
    <text class="mono sign" x="16" y="196">&lt;ui /&gt; built from components — ankit jha</text>
  </g>
</svg>